name: Generate PDF from Markdown

on:
  workflow_dispatch:
  push:
    paths:
      - 'reports/analisis_visual_marcas.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (pandoc + wkhtmltopdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf
      - name: Generate PDF from Markdown using wkhtmltopdf
        run: |
          mkdir -p reports
          pandoc reports/analisis_visual_marcas.md -o reports/analisis_visual_marcas.pdf --pdf-engine=wkhtmltopdf
      - name: Commit generated PDF
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Add generated PDF report"
          file_pattern: "reports/analisis_visual_marcas.pdf"
